<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jujutsu Kaisen: Expansión de Dominio - Juego Rítmico y de Disparos</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        #ui-menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-align: center;
            background: rgba(0, 0, 0, 0.75);
            padding: 25px;
            border-radius: 15px;
            border: 2px solid #333;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 90%;
            width: 400px;
        }
        .contenedor-fila {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            width: 100%;
        }
        .tarjeta-minijuego {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 10px;
            padding: 12px;
            flex: 1;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .tarjeta-minijuego:active {
            transform: scale(0.95);
        }
        .btn-jugar {
            border: none;
            padding: 8px 12px;
            border-radius: 5px;
            font-weight: bold;
            color: black;
            width: 100%;
            margin-top: 8px;
            cursor: pointer;
        }
        .btn-volver {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 20;
            background: rgba(255,0,0,0.7);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            font-weight: bold;
            display: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <button id="btn-volver" class="btn-volver" onclick="volverAlMenu()">⬅ Volver al Menú</button>

    <div id="ui-menu">
        <h1 style="margin: 0 0 10px 0; font-size: 24px; text-transform: uppercase; letter-spacing: 2px;">Expansión</h1>
        <p style="color: #aaa; margin: 0; font-size: 14px;">Selecciona un modo de juego</p>
        
        <div class="contenedor-fila">
            <div class="tarjeta-minijuego" style="border-bottom: 4px solid #00ffcc;">
                <h3 style="margin: 5px 0;">Dance of Fire</h3>
                <p style="font-size: 11px; color: #ccc; margin: 0;">Juego rítmico de órbitas.</p>
                <button class="btn-jugar" style="background: #00ffcc;" onclick="cambiarModo('ritmo')">JUGAR</button>
            </div>
            
            <div class="tarjeta-minijuego" style="border-bottom: 4px solid #ffaa00;">
                <h3 style="margin: 5px 0;">Shoot the Box</h3>
                <p style="font-size: 11px; color: #ccc; margin: 0;">Físicas y destrucción rápida.</p>
                <button class="btn-jugar" style="background: #ffaa00;" onclick="cambiarModo('disparos')">JUGAR</button>
            </div>
        </div>

        <h3 style="margin: 25px 0 10px 0; font-size: 18px; align-self: flex-start;">Tienda de Habilidades (15)</h3>
        <div id="tienda-lista" style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; max-height: 180px; overflow-y: auto; width: 100%; padding-right: 5px;">
            </div>
    </div>

    <div id="canvas-container"></div>

    <script src="hitboxes.js"></script>
    <script src="tienda.js"></script>
    <script src="minijuegos.js"></script>
    <script src="sketch.js"></script>

</body>
</html>
<title> shadow cat: bullet swarm - Juego Rítmico y de Disparos</title>
